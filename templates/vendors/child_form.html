{% extends "base.html" %}
{% block content %}
<div class="max-w-[560px] mx-auto px-4 sm:px-6 py-6">
  <a href="{% url 'vendor_detail' vendor.pk %}" class="inline-flex items-center gap-1.5 text-[12.5px] text-muted hover:text-ink mb-4">
    <i class="ti ti-arrow-left text-[15px]"></i> {{ vendor.name }}
  </a>
  <h1 class="font-display text-[20px] font-semibold text-ink tracking-tight mb-5">{{ page_title }}</h1>

  <form method="post" enctype="multipart/form-data" class="card p-5 grid gap-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block text-[12px] font-medium text-muted mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<p class="text-[11px] text-muted mt-1">{{ field.help_text }}</p>{% endif %}
      {% if field.errors %}<p class="text-[11px] text-rose-600 mt-1">{{ field.errors|striptags }}</p>{% endif %}
    </div>
    {% endfor %}
    <div class="flex justify-end gap-2 pt-1">
      <a href="{% url 'vendor_detail' vendor.pk %}" class="text-[12.5px] font-semibold rounded-full px-3.5 py-2 text-muted hover:text-ink">Cancel</a>
      <button type="submit" class="btn-gold text-[12.5px] font-semibold rounded-full px-4 py-2">Save</button>
    </div>
  </form>
</div>
{% endblock %}
