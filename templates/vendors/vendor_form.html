{% extends "base.html" %}
{% block content %}
<div class="max-w-[720px] mx-auto px-4 sm:px-6 py-6">
  <a href="{% if target %}{% url 'vendor_detail' target.pk %}{% else %}{% url 'vendor_list' %}{% endif %}"
     class="inline-flex items-center gap-1.5 text-[12.5px] text-muted hover:text-ink mb-4">
    <i class="ti ti-arrow-left text-[15px]"></i> {% if target %}{{ target.name }}{% else %}Vendors{% endif %}
  </a>
  <h1 class="font-display text-[22px] font-semibold text-ink tracking-tight mb-5">{{ page_title }}</h1>

  <form method="post" class="card p-5 grid gap-4 sm:grid-cols-2">
    {% csrf_token %}
    {% for field in form %}
    <div class="{% if field.name == 'notes' or field.name == 'service_area' or field.name == 'address_line1' %}sm:col-span-2{% endif %}">
      <label for="{{ field.id_for_label }}" class="block text-[12px] font-medium text-muted mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="text-[11px] text-rose-600 mt-1">{{ field.errors|striptags }}</p>{% endif %}
    </div>
    {% endfor %}
    <div class="sm:col-span-2 flex justify-end gap-2 pt-2">
      <a href="{% if target %}{% url 'vendor_detail' target.pk %}{% else %}{% url 'vendor_list' %}{% endif %}"
         class="text-[12.5px] font-semibold rounded-full px-3.5 py-2 text-muted hover:text-ink">Cancel</a>
      <button type="submit" class="btn-gold text-[12.5px] font-semibold rounded-full px-4 py-2">Save vendor</button>
    </div>
  </form>
</div>
{% endblock %}
