{# Stacked toasts — $store.toast.push({type, title, message}) #}
<div class="fixed bottom-5 right-5 z-[70] flex flex-col gap-2.5 items-end" x-data>
  <template x-for="t in $store.toast.items" :key="t.id">
    <div class="bg-surface rounded-xl shadow-2xl ring-1 ring-line w-[320px] max-w-[calc(100vw-2.5rem)] overflow-hidden"
         style="animation: toastIn .3s cubic-bezier(.2,.7,.2,1) both">
      <div class="flex gap-3 p-3.5">
        <span class="w-8 h-8 rounded-lg grid place-items-center shrink-0"
              :class="{ 'bg-emerald-50 text-emerald-600': t.type==='success', 'bg-rose-50 text-rose-600': t.type==='danger', 'bg-sky-50 text-sky-600': t.type==='info' }">
          <i class="ti text-[17px]" :class="{ 'ti-circle-check': t.type==='success', 'ti-alert-triangle': t.type==='danger', 'ti-info-circle': t.type==='info' }"></i>
        </span>
        <div class="min-w-0 flex-1">
          <div class="text-[13px] font-semibold text-ink" x-text="t.title"></div>
          <div class="text-[12px] text-muted mt-0.5" x-show="t.message" x-text="t.message"></div>
        </div>
        <button @click="$store.toast.dismiss(t.id)" class="text-slate-400 hover:text-ink self-start"><i class="ti ti-x text-[15px]"></i></button>
      </div>
    </div>
  </template>
</div>
