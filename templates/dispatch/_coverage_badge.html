{# Coverage pill — takes a coverage_state (selectors.coverage_state). uniform=1 fixes the width. #}
<span class="inline-flex items-center justify-center gap-1.5 text-[11px] font-semibold px-2 py-0.5 rounded-full ring-1 ring-inset {% if uniform %}w-[86px]{% endif %} {% if coverage == 'uncovered' %}bg-amber-50 text-amber-700 ring-amber-600/20{% elif coverage == 'offered' %}bg-sky-50 text-sky-700 ring-sky-600/20{% elif coverage == 'assigned' %}bg-surface text-emerald-700 ring-emerald-600/30{% else %}bg-emerald-50 text-emerald-700 ring-emerald-600/20{% endif %}">
  {% if coverage == 'uncovered' %}Unassigned{% elif coverage == 'offered' %}Offered{% elif coverage == 'assigned' %}Assigned{% elif coverage == 'dispatched' %}Dispatched{% else %}Confirmed{% endif %}
</span>
