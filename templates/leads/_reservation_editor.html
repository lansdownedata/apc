{% comment %}
Reservation editor modal — used inside quoteWorkspace() x-data scope.
Uses x-show (not x-if / <template>) so Tom Select is initialised once on DOMContentLoaded.

Escape closes the editor, except the Escape that just dismissed a picker — see
`fpJustClosed()` in app.js for why the calendar can't simply be looked for.

One x-show, on the OUTER container, and no x-transition anywhere. A transition on the
backdrop made Alpine defer the container's hide to that child, and a transition on the
container itself never settled either — both left it `display:flex` after closing, with
an invisible backdrop eating the next click on the page. The panel's entrance is the
`.pop` CSS animation, so nothing is lost by hiding outright.
{% endcomment %}
<div x-cloak x-show="editorOpen" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" @keydown.escape.window="if (!fpJustClosed()) closeEditor()">
  <div class="absolute inset-0 bg-charcoal/55 backdrop-blur-sm" @click="closeEditor()"></div>
  <div class="pop relative w-full sm:max-w-[620px] max-h-[94vh] bg-surface rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    <div class="flex flex-col min-h-0">
      <!-- header -->
      <div class="flex items-center gap-3 px-6 py-4 border-b border-line">
        <span class="w-9 h-9 rounded-lg grid place-items-center"
              :class="draft.tripType === 'hourly' ? 'bg-violet-50 text-violet-600' : 'bg-sky-50 text-sky-600'">
          <i class="ti text-[18px]" :class="draft.tripType === 'hourly' ? 'ti-clock-hour-4' : 'ti-arrow-narrow-right'"></i>
        </span>
        <div>
          <div class="font-display text-[16px] font-semibold text-ink" x-text="draftIsNew ? 'Add reservation' : 'Edit reservation'"></div>
          <div class="text-[11.5px] text-muted">One reservation = one LimoAnywhere trip on booking</div>
        </div>
        <button @click="closeEditor()" class="ml-auto text-muted hover:text-ink"><i class="ti ti-x text-xl"></i></button>
      </div>

      <div class="overflow-y-auto px-6 py-5 space-y-5">
        <!-- trip type -->
        <div>
          <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Trip type</label>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button @click="setDraftType('transfer')" type="button"
              class="flex items-center gap-2.5 px-3.5 py-3 rounded-xl ring-1 text-left transition"
              :class="draft.tripType === 'transfer' ? 'ring-2 ring-gold bg-goldl' : 'ring-line hover:ring-slate-300'">
              <i class="ti ti-arrow-narrow-right text-[20px]" :class="draft.tripType === 'transfer' ? 'text-goldd' : 'text-muted'"></i>
              <div><div class="text-[13px] font-semibold text-ink">Transfer</div><div class="text-[11px] text-muted">Point-to-point, flat rate</div></div>
            </button>
            <button @click="setDraftType('hourly')" type="button"
              class="flex items-center gap-2.5 px-3.5 py-3 rounded-xl ring-1 text-left transition"
              :class="draft.tripType === 'hourly' ? 'ring-2 ring-gold bg-goldl' : 'ring-line hover:ring-slate-300'">
              <i class="ti ti-clock-hour-4 text-[20px]" :class="draft.tripType === 'hourly' ? 'text-goldd' : 'text-muted'"></i>
              <div><div class="text-[13px] font-semibold text-ink">Hourly</div><div class="text-[11px] text-muted">As-directed, by the hour</div></div>
            </button>
          </div>
        </div>

        <!-- what's being booked -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="sm:col-span-2">
            <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Service name</label>
            <input x-model="draft.service" placeholder="e.g. Wedding — as-directed" class="field mt-1.5 text-[13px]">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Vehicle</label>
            {# delegation — Tom Select fires change on the <select> which bubbles to this wrapper #}
            <div class="mt-1.5" @change="draft.vehicle = $event.target.value; applyVehicleRateCard()">
              {% include "components/searchable_select.html" with name="vehicle" field_id="f-res-vehicle" options=vehicle_options empty_label="Select vehicle" search="off" %}
            </div>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Passengers</label>
            <input x-model.number="draft.pax" type="number" min="1" class="field mt-1.5 text-[13px] num">
          </div>
        </div>

        {% comment %}
        Schedule — start and end sit together because they're one fact. Pickers are
        flatpickr, same build and options as the public booking widget; `data-fp-past`
        lets an agent enter or correct a trip after it ran. x-show (never x-if) keeps
        each instance alive, and x-effect repaints it when the draft changes underneath.
        {% endcomment %}
        <div>
          <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Schedule</label>
          <div class="mt-1.5 grid grid-cols-2 gap-3">
            <div>
              <div class="text-[11.5px] text-muted mb-1">Pickup date</div>
              <input type="text" data-flatpickr data-fp-past placeholder="Select a date"
                x-model="draft.date" x-init="initFlatpickr($el)" x-effect="fpSync($el, draft.date)"
                @input="onHoursChanged()" class="field text-[13px]">
            </div>
            <div>
              <div class="text-[11.5px] text-muted mb-1">Pickup time</div>
              <input type="text" data-flatpickr-time placeholder="Select a time"
                x-model="draft.time" x-init="initFlatpickr($el)" x-effect="fpSync($el, draft.time)"
                @input="onHoursChanged()" class="field text-[13px]">
            </div>

            <div class="col-span-2 grid grid-cols-2 gap-3" x-show="draft.tripType === 'transfer'">
              <div>
                <div class="text-[11.5px] text-muted mb-1">Drop-off date</div>
                <input type="text" data-flatpickr data-fp-past placeholder="Select a date"
                  x-model="draft.dropoffDate" x-init="initFlatpickr($el)" x-effect="fpSync($el, draft.dropoffDate)"
                  class="field text-[13px]">
              </div>
              <div>
                <div class="text-[11.5px] text-muted mb-1">Drop-off time</div>
                <input type="text" data-flatpickr-time placeholder="Select a time"
                  x-model="draft.dropoffTime" x-init="initFlatpickr($el)" x-effect="fpSync($el, draft.dropoffTime)"
                  class="field text-[13px]">
              </div>
            </div>

            {# hourly: the end is derived from the booked hours, so read it out rather than ask twice #}
            <div class="col-span-2 flex items-center gap-2 text-[12px] text-muted" x-show="draft.tripType === 'hourly'">
              <i class="ti ti-clock-hour-4 text-[15px] text-goldd"></i>
              <span x-show="dropoffLabel()">
                Ends <span class="font-medium text-ink num" x-text="dropoffLabel()"></span>
                — <span class="num" x-text="billedHours(draft)"></span> hrs as directed
              </span>
              <span x-show="!dropoffLabel()">Set a pickup date, time and hours to see when the trip ends.</span>
            </div>
          </div>
        </div>

        <!-- route / stops -->
        <div>
          <div class="flex items-center justify-between">
            <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Route</label>
            <span x-show="draft.stops.length > 2" class="text-[10.5px] font-medium text-goldd bg-goldl px-1.5 py-0.5 rounded">
              <span x-text="draft.stops.length - 2"></span> extra <span x-text="draft.stops.length === 3 ? 'stop' : 'stops'"></span>
            </span>
          </div>
          <div class="mt-2 space-y-2">
            <template x-for="(s, i) in draft.stops" :key="i">
              <div class="flex gap-2.5">
                <div class="flex flex-col items-center pt-[7px] pb-1">
                  <span class="w-2.5 h-2.5 rounded-full ring-2 ring-white shadow shrink-0"
                        :class="i === 0 ? 'bg-gold' : (i === draft.stops.length - 1 ? 'bg-charcoal' : 'bg-slate-300')"></span>
                  <span x-show="i < draft.stops.length - 1" class="route-line w-[2px] flex-1 min-h-[1rem] mt-1"></span>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-baseline gap-2 mb-0.5">
                    <span class="text-[10px] font-medium uppercase tracking-wide"
                          :class="i === 0 ? 'text-goldd' : (i === draft.stops.length - 1 ? 'text-ink' : 'text-muted')"
                          x-text="stopLabel(i, draft.stops.length)"></span>
                    {# the endpoints happen at the trip's own times — echoed, never asked for twice #}
                    <span x-show="stopTime(i, draft.stops.length)" class="text-[10.5px] text-muted num"
                          x-text="stopTime(i, draft.stops.length)"></span>
                    <span x-show="s.airportCode" x-cloak class="text-[10.5px] text-goldd num flex items-center gap-0.5">
                      <i class="ti ti-plane text-[12px]"></i><span x-text="s.airportCode"></span>
                    </span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <div class="sa-search flex-1" @keydown.escape="closeStopRow(i)"
                         @keydown.down.prevent="stopRow(i).list.length && (stopRow(i).active = (stopRow(i).active + 1) % stopRow(i).list.length)"
                         @keydown.enter.prevent="chooseStop(i, stopRow(i).active)">
                      <input x-model="s.address"
                        :placeholder="i === 0 ? 'Pickup address' : (i === draft.stops.length - 1 ? 'Drop-off address' : 'Stop address')"
                        autocomplete="off" data-1p-ignore data-lpignore="true"
                        @input="s.airport = ''; s.airportCode = ''"
                        @input.debounce.300ms="searchStop(i)"
                        @focus="stopRow(i).list.length && (stopRow(i).open = true)"
                        class="field text-[12.5px]">
                      <div class="sa-drop" role="listbox" x-show="stopRow(i).open" x-cloak @click.outside="closeStopRow(i)">
                        <template x-for="(r, j) in stopRow(i).list" :key="j">
                          {% include "components/_ac_result_row.html" with idx="j" active_expr="stopRow(i).active" choose_expr="chooseStop(i, j)" %}
                        </template>
                      </div>
                    </div>
                    <button x-show="i !== 0 && i !== draft.stops.length - 1" @click="removeStop(i)" class="text-muted hover:text-rose-600 p-1">
                      <i class="ti ti-trash text-[16px]"></i>
                    </button>
                  </div>
                  <div class="mt-1 flex items-start gap-1.5">
                    <input x-model="s.name" placeholder="Venue name (optional)"
                      class="field flex-1 min-w-0 text-[12.5px]">
                    {% comment %}
                    Only the in-between stops carry a time of their own — and the wrapper,
                    not the input, owns x-show: flatpickr hides the real input behind an
                    altInput sibling, so hiding the input alone would leave the picker visible.
                    {% endcomment %}
                    <div class="shrink-0 w-[128px]" x-show="i !== 0 && i !== draft.stops.length - 1">
                      <input type="text" data-flatpickr-time placeholder="Arrive"
                        x-model="s.time" x-init="initFlatpickr($el)" x-effect="fpSync($el, s.time)"
                        class="field text-[12.5px]">
                    </div>
                  </div>
                  {% comment %}
                  Flight row — only for a stop picked from the airport results (s.airport is
                  the Airport pk; typing in the address clears it). The airline select is a
                  Tom Select inside this x-for, so each row enhances its own element; the
                  generated id is dropped first so rows don't share one. x-effect keeps the
                  picker in step with the draft when a saved stop is opened for editing.
                  {% endcomment %}
                  <div x-show="s.airport" x-cloak class="mt-1.5 flex items-center gap-1.5">
                    <div class="flex-1 min-w-0 ts-compact"
                         x-init="$el.querySelector('select').removeAttribute('id'); initTomSelects($el)"
                         x-effect="const el = $el.querySelector('select'); if (el && el.tomselect && el.tomselect.getValue() !== String(s.airline || '')) el.tomselect.setValue(String(s.airline || ''), true)"
                         @change="s.airline = $event.target.value">
                      {% include "components/searchable_select.html" with name="airline" field_id="f-res-airline" options=airline_options empty_label="Airline" %}
                    </div>
                    {# the wrapper owns the width: .field is width:100% and app.css loads after Tailwind #}
                    {% comment %} pattern accepts both digits (real carrier) and a tail number like "N561FX"
                       (seeded Private carrier) — see Stop.flight_number / drafts.TAIL_RE. {% endcomment %}
                    <div class="shrink-0 w-[110px]">
                      <input x-model="s.flight" :inputmode="isPrivateAirline(i) ? 'text' : 'numeric'"
                        pattern="[0-9A-Za-z]*" maxlength="6"
                        :placeholder="isPrivateAirline(i) ? 'Tail #' : 'Flight #'"
                        class="field text-[12.5px] num">
                    </div>
                    {% comment %} A middle stop chooses which side of the flight it meets;
                         the ends are fixed by position (mirrored server-side). {% endcomment %}
                    <div x-show="i !== 0 && i !== draft.stops.length - 1"
                         class="shrink-0 inline-flex rounded-lg ring-1 ring-line overflow-hidden">
                      <button type="button" @click="s.direction = 'arrival'"
                              :class="s.direction === 'arrival' ? 'bg-goldl text-goldd font-semibold' : 'text-muted hover:text-ink'"
                              class="px-2 py-1.5 text-[11.5px] font-medium inline-flex items-center gap-1">
                        <i class="ti ti-plane-arrival text-[13px]"></i> Arriving
                      </button>
                      <button type="button" @click="s.direction = 'departure'"
                              :class="s.direction === 'departure' ? 'bg-goldl text-goldd font-semibold' : 'text-muted hover:text-ink'"
                              class="px-2 py-1.5 text-[11.5px] font-medium inline-flex items-center gap-1">
                        <i class="ti ti-plane-departure text-[13px]"></i> Departing
                      </button>
                    </div>
                    {% if flight_verify_enabled %}
                    {% comment %} Verify → becomes the pill once checked; any edit to the key reverts it (spec §7.3).
                       Never offered for the Private carrier — a tail number has no scheduled flight
                       number for aviationstack to look up (2026-08-29 §3). {% endcomment %}
                    <button type="button" x-show="!verifyPill(i) && s.airportCode && s.airportCode.length === 3 && s.hasScheduledService && !isPrivateAirline(i)"
                            @click="verifyStop(i)" :disabled="!canVerify(i)" :title="verifyReason(i)"
                            class="btn-ghost shrink-0 text-[12px] font-medium text-muted hover:text-ink px-2.5 py-2 rounded-lg ring-1 ring-line inline-flex items-center gap-1 disabled:opacity-45 disabled:cursor-not-allowed">
                      <i class="ti text-[14px]" :class="s.verifying ? 'ti-loader-2 animate-spin' : (stopDirection(i) === 'departure' ? 'ti-plane-departure' : 'ti-plane-arrival')"></i> Verify
                    </button>
                    <button type="button" x-show="verifyPill(i)" x-cloak @click="verifyStop(i)"
                            :class="FLIGHT_CHIP_BASE + ' ' + (verifyPill(i) ? verifyPill(i).chip : '')"
                            :title="verifyPill(i) ? verifyPill(i).detail : ''" class="shrink-0 px-2 py-1">
                      <i class="ti text-[13px]" :class="verifyPill(i) ? verifyPill(i).icon : ''"></i>
                      <span x-text="verifyPill(i) ? verifyPill(i).label : ''"></span>
                      <i class="ti ti-refresh text-[12px] opacity-60"></i>
                    </button>
                    {% endif %}
                  </div>
                  <input x-show="i !== 0 && i !== draft.stops.length - 1" x-model="s.note"
                    placeholder="Note (e.g. 20-min photo stop)"
                    class="field mt-1 text-[11.5px] py-1.5 text-muted">
                </div>
              </div>
            </template>
          </div>
          <button @click="addStop()" class="mt-2 flex items-center gap-1.5 text-[12px] font-medium text-goldd hover:underline">
            <i class="ti ti-map-pin-plus text-[15px]"></i> Add stop
          </button>
        </div>

        <!-- pricing -->
        <div class="rounded-xl bg-surface2 ring-1 ring-line p-4">
          <label class="text-[11px] font-semibold text-muted uppercase tracking-wide">Pricing</label>
          <div class="mt-2 grid grid-cols-3 gap-3">
            <div>
              <div class="text-[12px] text-muted mb-1" x-text="draft.tripType === 'hourly' ? 'Rate / hr' : 'Rate (flat)'"></div>
              <div class="flex items-center ring-1 ring-line rounded-xl bg-surface px-3 focus-within:ring-2 focus-within:ring-gold">
                <span class="text-muted text-[13px]">$</span>
                <input x-model.number="draft.rate" type="number" min="0" class="w-full text-[13px] px-2 py-2.5 outline-none num bg-transparent text-ink">
              </div>
            </div>
            <div>
              <div class="text-[12px] text-muted mb-1">Override hours</div>
              {% comment %}
              x-model.number, with '' as "no override": a reactive :value binding re-renders the box
              mid-keystroke and eats a leading 0 or ".".
              {% endcomment %}
              <input x-model.number="draft.hours" type="number" min="0" step="0.25" placeholder="—"
                @input="onHoursChanged()" class="field text-[13px] num">
            </div>
            <div>
              <div class="text-[12px] text-muted mb-1">Min hours</div>
              <input x-model.number="draft.minHours" type="number" readonly
                title="From the vehicle's rate card"
                class="field text-[13px] num read-only:bg-surface2 read-only:text-muted">
            </div>
          </div>
          <div x-show="minApplied(draft)"
               class="mt-2 flex items-center gap-1.5 text-[11.5px] text-amber-700 bg-amber-50 ring-1 ring-inset ring-amber-600/15 rounded-lg px-2.5 py-1.5">
            <i class="ti ti-info-circle text-[14px]"></i> Minimum applies — billing <span class="font-semibold" x-text="billedHours(draft)"></span> hrs
          </div>
          <div x-show="noMinimum(draft)"
               class="mt-2 flex items-center gap-1.5 text-[11.5px] text-amber-700 bg-amber-50 ring-1 ring-inset ring-amber-600/15 rounded-lg px-2.5 py-1.5">
            <i class="ti ti-alert-triangle text-[14px]"></i> No minimum for this trip — pick a vehicle or enter override hours
          </div>
          <div class="mt-3">
            <div class="text-[12px] text-muted mb-1">Gratuity %</div>
            <div class="flex items-center ring-1 ring-line rounded-xl bg-surface px-3 focus-within:ring-2 focus-within:ring-gold w-1/3">
              <input x-model.number="draft.gratuityPct" type="number" min="0" class="w-full text-[13px] px-2 py-2.5 outline-none num bg-transparent text-ink">
              <span class="text-muted text-[13px]">%</span>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-line flex items-center justify-between">
            <span class="text-[12px] text-muted">Subtotal</span>
            <span class="text-[13px] font-medium text-ink num" x-text="money(resSubtotal(draft))"></span>
          </div>
          <div class="mt-1 flex items-center justify-between">
            <span class="text-[12.5px] text-muted">Line total</span>
            <span class="font-display text-[20px] font-semibold text-ink num" x-text="money(resTotal(draft))"></span>
          </div>
        </div>
      </div>

      <!-- footer -->
      <div class="px-6 py-4 border-t border-line bg-surface2 flex items-center gap-2">
        <button @click="closeEditor()" class="btn-ghost text-[13px] font-medium text-muted hover:text-ink px-4 py-2.5 rounded-lg ring-1 ring-line bg-surface">Cancel</button>
        <button @click="saveReservation()" class="btn-gold ml-auto flex items-center gap-1.5 text-[13px] font-semibold rounded-lg px-5 py-2.5">
          <i class="ti ti-check text-[16px]"></i> <span x-text="draftIsNew ? 'Add to quote' : 'Save changes'"></span>
        </button>
      </div>
    </div>
  </div>
</div>
