{# Shared shell for the public trip acknowledgement pages (APC-18/19/20). #}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Your trip · All Pro Charter{% endblock %}</title>
<link rel="icon" href="{% static 'brand/favicon.svg' %}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:199 162 78;--text:23 25 29;--muted:107 114 124;--surface:255 255 255;--border:229 226 217;--ok:22 128 90}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:40px 20px;
       font-family:'Inter',system-ui,sans-serif;color:rgb(var(--text));
       background:radial-gradient(900px 520px at 50% -8%,#20262f 0%,#14181f 58%,#0e1117 100%)}
  .wrap{width:100%;max-width:600px;margin:0 auto}
  .card{background:rgb(var(--surface));border:1px solid rgb(var(--border));
        border-radius:20px;padding:32px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:600;margin:0 0 6px;text-align:center}
  .sub{color:rgb(var(--muted));font-size:13.5px;line-height:1.6;text-align:center;margin:0 0 22px}
  p{color:rgb(var(--muted));font-size:13.5px;line-height:1.6}
  .trip-sheet{margin:0 0 22px;border-top:1px solid rgb(var(--border))}
  .trip-sheet>div{display:flex;gap:16px;padding:11px 2px;border-bottom:1px solid rgb(var(--border));font-size:14px}
  .trip-sheet dt{flex:0 0 92px;color:rgb(var(--muted));margin:0}
  .trip-sheet dd{margin:0;font-weight:500}
  form{margin:0}
  label.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:rgb(var(--muted));margin:0 0 18px;cursor:pointer}
  input[type=text]{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid rgb(var(--border));border-radius:10px;margin-top:4px}
  .fld{margin:0 0 16px}
  .fld span{display:block;font-size:12px;font-weight:600;color:rgb(var(--muted))}
  button{width:100%;font:inherit;font-weight:600;font-size:14px;padding:12px;border:0;border-radius:12px;
         background:rgb(var(--gold));color:#1a1206;cursor:pointer}
  .done{text-align:center;padding:8px 0}
  .done .mark{width:44px;height:44px;border-radius:999px;background:rgba(22,128,90,.12);color:rgb(var(--ok));
              font-size:24px;line-height:44px;display:inline-block;margin-bottom:10px}
  .cancelled{text-align:center;color:rgb(var(--muted));font-size:14px}
</style>
</head>
<body>
  <div class="wrap"><div class="card">
    {% block body %}{% endblock %}
  </div></div>
</body>
</html>
