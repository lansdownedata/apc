<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-panel"
       style="background:#FAF8F3;border:1px solid #E7E3DA;border-radius:12px;">
  <tr><td style="padding:24px 26px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td width="52%" valign="top">
        <div class="dm-soft" style="font-size:11px;font-weight:bold;letter-spacing:1.5px;color:#a59e90;">QUOTE NO.</div>
        <div class="dm-ink" style="font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:19px;font-weight:600;color:#17191D;padding-top:5px;">{{ quote_no }}</div>
      </td>
      <td width="48%" valign="top">
        <div class="dm-soft" style="font-size:11px;font-weight:bold;letter-spacing:1.5px;color:#a59e90;">PREPARED FOR</div>
        <div class="dm-ink" style="font-size:15px;color:#17191D;padding-top:7px;line-height:1.4;">{{ contact_name }}</div>
      </td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:22px 26px 0;">
    <div style="border-top:1px solid #C7A24E;font-size:0;line-height:0;height:0;">&#8203;</div>
  </td></tr>
  <tr><td style="padding:18px 26px 26px;">
    <div class="dm-soft" style="font-size:11px;font-weight:bold;letter-spacing:1.5px;color:#a59e90;">ESTIMATED TOTAL</div>
    <div class="dm-ink" style="font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:36px;font-weight:600;color:#17191D;padding:6px 0 4px;">${{ quote_total }}</div>
    <div class="dm-muted" style="font-size:14px;color:#6b7280;">{% if on_account %}This booking is billed to your account. No payment is taken now.{% else %}A {{ deposit_pct }}% deposit of ${{ deposit_amount }} reserves your booking.{% endif %}</div>
  </td></tr>
</table>
