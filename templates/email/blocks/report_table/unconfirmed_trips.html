<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:13px;border-collapse:collapse;">
  <tr style="color:#6b7280;text-align:left;">
    <th style="padding:6px 8px;border-bottom:1px solid #E7E3DA;">Customer</th>
    <th style="padding:6px 8px;border-bottom:1px solid #E7E3DA;">Trips tomorrow</th>
  </tr>
  {% for r in rows %}
  <tr>
    <td style="padding:8px;border-bottom:1px solid #F0EDE6;vertical-align:top;">
      <div style="font-weight:600;color:#17191D;"><a href="{{ r.url }}" style="color:#8A6D1F;">{{ r.customer }}</a></div>
      <div style="color:#6b7280;">{{ r.email|default:"no email" }}<br>{{ r.phone|default:"no phone" }}</div>
    </td>
    <td style="padding:8px;border-bottom:1px solid #F0EDE6;vertical-align:top;">
      {% for t in r.trips %}
        <div style="margin:0 0 6px;">
          <span style="font-weight:600;color:#17191D;">{{ t.when }}</span>
          <span style="color:#6b7280;"> · {{ t.quote_no }}</span><br>
          <span style="color:#4b5563;">{{ t.route }}</span>
        </div>
      {% endfor %}
    </td>
  </tr>
  {% endfor %}
</table>
