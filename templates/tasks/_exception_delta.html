{% comment %} Change against a week ago: up is worse (rose), down is better (emerald). Requires: delta (int or None), suffix. {% endcomment %}{% if delta is None %}{% elif delta > 0 %}<span class="text-[12.5px] font-semibold text-rose-600 num">+{{ delta }}{{ suffix }}</span>{% elif delta < 0 %}<span class="text-[12.5px] font-semibold text-emerald-600 num">{{ delta }}{{ suffix }}</span>{% else %}<span class="text-[12.5px] text-muted">No change{{ suffix }}</span>{% endif %}
