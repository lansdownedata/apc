{% load humanize json_filters %}
{% if user.has_payments_access %}
<div class="border-t border-line px-5 py-4">
  <div class="font-display text-[12.5px] font-semibold text-ink mb-3 flex items-center gap-1.5">
    <i class="ti ti-settings-2 text-[14px] text-muted"></i> Actions
  </div>
  <div class="flex flex-wrap gap-2">

    <!-- Refund -->
    <form method="post" action="{% url 'order_refund' lead.pk %}" class="contents">
      {% csrf_token %}
      <div class="flex items-center gap-1.5">
        <input
          type="number"
          name="amount"
          step="0.01"
          min="0.01"
          value="{{ balances.collected|floatformat:2 }}"
          class="w-28 text-[12px] num border border-line rounded-lg px-2.5 py-1.5 bg-surface text-ink focus:outline-none focus:ring-2 focus:ring-gold/40"
          placeholder="Amount"
        >
        <button
          type="button"
          class="btn-ghost inline-flex items-center gap-1.5 text-[12px] font-medium text-ink rounded-lg px-3 py-1.5 ring-1 ring-line bg-surface hover:bg-black/5"
          @click="$store.modal.confirm({
            title: 'Issue a refund?',
            variant: 'danger',
            confirmText: 'Refund',
            message: 'This issues a real Stripe refund to the card on file. The amount cannot be undone.',
            onConfirm: () => $el.closest('form').submit()
          })"
        >
          <i class="ti ti-arrow-back-up text-[14px]"></i> Refund
        </button>
      </div>
    </form>

    <!-- Cancel & refund -->
    <form method="post" action="{% url 'order_cancel_refund' lead.pk %}" class="contents">
      {% csrf_token %}
      <button
        type="button"
        class="btn-ghost inline-flex items-center gap-1.5 text-[12px] font-medium text-rose-600 rounded-lg px-3 py-1.5 ring-1 ring-rose-200 bg-surface hover:bg-rose-50"
        @click="$store.modal.confirm({
          title: 'Cancel order and refund?',
          variant: 'danger',
          confirmText: 'Cancel &amp; Refund',
          message: 'This will cancel all reservations, mark the lead as lost, and issue a full Stripe refund. This cannot be undone.',
          onConfirm: () => $el.closest('form').submit()
        })"
      >
        <i class="ti ti-circle-x text-[14px]"></i> Cancel &amp; refund
      </button>
    </form>

    <!-- Retry balance (only when last attempt failed) -->
    {% if payment.balance_status == 'failed' %}
    <form method="post" action="{% url 'order_retry_balance' lead.pk %}" class="contents">
      {% csrf_token %}
      <button
        type="button"
        class="btn-ghost inline-flex items-center gap-1.5 text-[12px] font-medium text-amber-700 rounded-lg px-3 py-1.5 ring-1 ring-amber-300 bg-surface hover:bg-amber-50"
        @click="$store.modal.confirm({
          title: 'Retry balance charge?',
          variant: 'warning',
          confirmText: 'Retry',
          message: 'This attempts to charge the saved card again for the outstanding balance.',
          onConfirm: () => $el.closest('form').submit()
        })"
      >
        <i class="ti ti-refresh-alert text-[14px]"></i> Retry balance
      </button>
    </form>
    {% endif %}
  </div>

  {% if lead.status != 'lost' %}
  <!-- Take payment (Stripe Payment Element) -->
  <div class="mt-4 pt-4 border-t border-line"
       x-data="adminCardPay({
         pk: {{ stripe_pk|json_string }},
         remaining: '{{ balances.remaining|floatformat:2 }}',
         hasCard: {{ payment.stripe_payment_method_id|yesno:'true,false' }},
         cardBrand: {{ payment.card_brand|default:''|json_string }},
         cardLast4: {{ payment.card_last4|default:''|json_string }},
         intentUrl: '{% url 'order_admin_intent' lead.pk %}',
         completeUrl: '{% url 'order_admin_complete' lead.pk %}',
         saveCardUrl: '{% url 'order_save_card' lead.pk %}',
         chargeSavedUrl: '{% url 'order_charge_saved' lead.pk %}'
       })">
    <div class="font-display text-[12.5px] font-semibold text-ink mb-3 flex items-center gap-1.5">
      <i class="ti ti-credit-card text-[14px] text-muted"></i> Take payment
    </div>
    <template x-if="hasCard && cardLast4">
      <p class="text-[12px] text-muted mb-2">
        Card on file:
        <span class="text-ink font-medium capitalize" x-text="cardBrand"></span>
        <span class="num text-ink" x-text="'•••• ' + cardLast4"></span>
      </p>
    </template>
    <div x-show="!hasCard || replacing" x-cloak>
      <div x-ref="cardMount" class="stripe-element mb-3 px-3 py-2.5"></div>
    </div>
    <p class="text-[12px] text-rose-600 mb-2" x-show="error" x-text="error" x-cloak></p>
    <div class="flex flex-wrap items-center gap-1.5">
      <input
        type="number"
        step="0.01"
        min="0.01"
        x-model="amount"
        @change="onAmountChange()"
        class="w-28 text-[12px] num border border-line rounded-lg px-2.5 py-1.5 bg-surface text-ink focus:outline-none focus:ring-2 focus:ring-gold/40"
        placeholder="Amount"
      >
      <button
        type="button"
        class="btn-ghost inline-flex items-center gap-1.5 text-[12px] font-medium text-emerald-700 rounded-lg px-3 py-1.5 ring-1 ring-emerald-200 bg-surface hover:bg-emerald-50 disabled:opacity-50"
        :disabled="busy"
        @click="charge()"
      >
        <i class="ti ti-credit-card text-[14px]"></i>
        <span x-text="busy ? 'Charging…' : 'Charge card'"></span>
      </button>
      <button
        type="button"
        class="btn-ghost inline-flex items-center gap-1.5 text-[12px] font-medium text-ink rounded-lg px-3 py-1.5 ring-1 ring-line bg-surface hover:bg-black/5 disabled:opacity-50"
        :disabled="busy"
        @click="saveCard()"
        x-show="!hasCard || replacing"
      >
        <i class="ti ti-device-floppy text-[14px]"></i> Save card
      </button>
      <button
        type="button"
        class="btn-ghost inline-flex items-center gap-1.5 text-[12px] font-medium text-muted rounded-lg px-3 py-1.5 hover:text-ink"
        x-show="hasCard && !replacing"
        @click="startReplace()"
      >
        Replace card
      </button>
    </div>
  </div>
  {% endif %}
</div>
{% endif %}
